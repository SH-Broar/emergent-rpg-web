name: Deploy to GitHub Pages

on:
  push:
    branches: [main, rdc-roguelike-main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node scripts/test-field-port.mjs
      - run: node scripts/test-field-simulation.mjs
      - run: node scripts/test-gesture-input.mjs
      - run: node scripts/test-field-skills.mjs
      - run: node scripts/test-skill-growth.mjs
      - run: node scripts/test-status-feedback.mjs
      - run: node scripts/test-field-transformation.mjs
      - run: node scripts/test-field-residents.mjs
      - run: node scripts/test-field-bases.mjs
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
